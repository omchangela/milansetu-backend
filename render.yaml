services:
  - type: web
    name: milansetu-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "milansetu-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://milansetu-frontend.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://milansetu-frontend.vercel.app,https://milansetu-backend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: milansetu-db
          property: connectionString

databases:
  - name: milansetu-db
    plan: free
    databaseName: milansetu
    user: milansetu
